networks:
  tg-net:
    driver: bridge

services:
  ### Redis
  redis:
    image: redis:8-alpine
    restart: always
    networks:
      - tg-net
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ### RabbitMq
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    networks:
      - tg-net
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RabbitMQ__Connections__Default__UserName:-test}
      - RABBITMQ_DEFAULT_PASS=${RabbitMQ__Connections__Default__Password}
      - RABBITMQ_ERLANG_COOKIE=${RabbitMQ__ErlangCookie:-changeme-cookie}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit vm_memory_high_watermark 0.8
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ### MongoDb
  mongodb:
    image: mongo:4.4
    restart: always
    networks:
      - tg-net
    ports:
      - "27017:27017"
    command: ["mongod", "--quiet", "--logpath", "/dev/null", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - ./data/mongo/db:/data/db
      - ./data/mongo/configdb:/data/configdb
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  ### Gateway server
  gateway-server:
    image: ${MyTelegramRegistry}/mytelegram-gateway-server:${MyTelegramVersion}
    restart: always
    networks:
      - tg-net
    ports:
      - "${App__Servers__0__Port}:${App__Servers__0__Port}"
      - "${App__Servers__1__Port}:${App__Servers__1__Port}"
    environment:
      - COMPlus_EnableAVX=0
      - RabbitMQ__Connections__Default__HostName=rabbitmq
      - RabbitMQ__Connections__Default__Port=5672
      - RabbitMQ__Connections__Default__UserName=${RabbitMQ__Connections__Default__UserName:-test}
      - RabbitMQ__Connections__Default__Password=${RabbitMQ__Connections__Default__Password}
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }

  ### Auth server
  auth-server:
    image: ${MyTelegramRegistry}/mytelegram-auth-server:${MyTelegramVersion}
    restart: always
    networks:
      - tg-net
    environment:
      - COMPlus_EnableAVX=0
      - RabbitMQ__Connections__Default__HostName=rabbitmq
      - RabbitMQ__Connections__Default__Port=5672
      - RabbitMQ__Connections__Default__UserName=${RabbitMQ__Connections__Default__UserName:-test}
      - RabbitMQ__Connections__Default__Password=${RabbitMQ__Connections__Default__Password}
      - Redis__Configuration=redis:6379
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  ### Session server
  session-server:
    image: ${MyTelegramRegistry}/mytelegram-session-server:${MyTelegramVersion}
    restart: always
    networks:
      - tg-net
    environment:
      - COMPlus_EnableAVX=0
      - RabbitMQ__Connections__Default__HostName=rabbitmq
      - RabbitMQ__Connections__Default__Port=5672
      - RabbitMQ__Connections__Default__UserName=${RabbitMQ__Connections__Default__UserName:-test}
      - RabbitMQ__Connections__Default__Password=${RabbitMQ__Connections__Default__Password}
      - Redis__Configuration=redis:6379
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
